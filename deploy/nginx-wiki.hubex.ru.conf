# Reference nginx config for wiki.hubex.ru — adjust cert paths to your existing certificate.
# Install to /etc/nginx/sites-available/wiki.hubex.ru.conf and symlink into sites-enabled.

server {
    listen 80;
    listen [::]:80;
    server_name wiki.hubex.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wiki.hubex.ru;

    # Adjust to your existing certificate's actual paths.
    ssl_certificate     /etc/ssl/hubex.ru/fullchain.pem;
    ssl_certificate_key /etc/ssl/hubex.ru/privkey.pem;

    root /var/www/wiki.hubex.ru/current;
    index index.html;

    # Pagefind ships .wasm search index files — without this nginx serves them
    # as application/octet-stream, which breaks WebAssembly.instantiateStreaming
    # in some browsers.
    types {
        application/wasm wasm;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
}
